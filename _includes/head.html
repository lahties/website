<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Open Graph Meta Tags -->
    {% assign social_image = page.cover_image | default: page.image %}
    {% if social_image %}
    <meta property="og:image" content="{{ social_image | absolute_url }}">
    {% else %}
    <meta property="og:image" content="{{ 'assets/images/page-banner.webp' | absolute_url }}">
    {% endif %}

    <link rel="icon" type="image/svg+xml" href="{{ 'assets/images/favicon.svg' | relative_url }}">
    <link rel="stylesheet" href="{{ 'assets/css/style.css' | relative_url }}">
    <link rel="stylesheet" href="{{ 'assets/css/fonts.css' | relative_url }}">
    {% if include.custom_css or page.custom_css %}
    <style>
        {{ include.custom_css }}
        {{ page.custom_css }}
    </style>
    {% endif %}
    {% seo %}
    {% include structured-data.html %}
</head>
